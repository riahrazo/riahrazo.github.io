<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <title>neriah's night</title>
  <style>
    .monsieur-la-doulaise-regular {
      font-family: "Monsieur La Doulaise", cursive;
      font-weight: 400;
      font-style: normal;
    }
    body{
      background-color: #3A275E;
    }
    h1{
      text-align: center;
      color:#524642;
      font-style: bold;
      font-size: 30%;
    }
    .glow-text {
      font-size: 3rem;
      
      /* Stacking shadows from sharp/intense to wide/faded */
      text-shadow: 
        0 0 5px #FFFAAB,
        0 0 10px #FFFAAB,
        0 0 20px #FFFAAB,
        0 0 40px #FFFAAB,
        0 0 80px #FFFAAB;
    }

  </style>
</head>
<body><h1 class="glow-text monsieur-la-doulaise-regular">Neriah's Night</h1></body>
</html>

<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <title>neriah's night</title>
  <style>
    .monsieur-la-doulaise-regular {
      font-family: "Monsieur La Doulaise", cursive;
      font-weight: 400;
      font-style: normal;
    }
    body{
      background-color: #191380;
    }
    h1{
      text-align: center;
      color:#6B52A3;
    }
    .glow-text {
      font-size: 3rem;
      font-family: sans-serif;
      
      /* Stacking shadows from sharp/intense to wide/faded */
      text-shadow: 
        0 0 5px #00ffca,
        0 0 10px #00ffca,
        0 0 20px #00ffca,
        0 0 40px #00ffca,
        0 0 80px #00ffca;
    }

  </style>
</head>
<body><h1 class="glow-text monsieur-la-doulaise-regular">Neriah's Night</h1></body>
</html>
